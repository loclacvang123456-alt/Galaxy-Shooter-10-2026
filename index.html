<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#030712" />
  <title>Galaxy Shooter - Turret Defense</title>
  <!-- GameDistribution HTML5 SDK (Azerion) -->
  <script type="text/javascript">
    window["GD_OPTIONS"] = {
      gameId: "75ed0507f513407a8f259d12c0945f6c",
      onEvent: function (event) {
        window.__GD_ON_EVENT__?.(event);
      }
    };
    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://html5.api.gamedistribution.com/main.min.js";
      fjs.parentNode.insertBefore(js, fjs);
    })(document, "script", "gamedistribution-jssdk");
  </script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030712;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    /* Mobile Landscape Hint Banner */
    #rotate-hint {
      display: none;
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #00f0ff;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      box-shadow: 0 4px 14px rgba(0, 240, 255, 0.25);
      pointer-events: none;
      letter-spacing: 0.5px;
      animation: pulseHint 2.4s infinite ease-in-out;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
    }
    @media screen and (orientation: portrait) and (max-width: 820px) {
      #rotate-hint {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="rotate-hint">📱 Please rotate your device to landscape for the best experience</div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
